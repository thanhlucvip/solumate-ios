<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iOS Device Setup</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="toolbar">
      <div class="title-block">
        <h1>iOS Device Setup</h1>
        <p>go-ios setup commands for connected devices</p>
      </div>
      <div class="actions-row">
        <a class="button-link" href="/">Stream</a>
        <button id="refreshDevicesBtn">Refresh devices</button>
      </div>
    </header>

    <main class="setup-layout">
      <section class="setup-panel">
        <div class="setup-grid">
          <label>
            Device
            <select id="deviceSelect"></select>
          </label>
          <label>
            UDID
            <input id="udidInput" type="text" spellcheck="false" autocomplete="off">
          </label>
        </div>

        <div class="setup-status">
          <span id="setupState" class="badge">idle</span>
          <code id="iosBinLabel">ios</code>
        </div>

        <h2>Pairing</h2>
        <div class="setup-actions">
          <button data-action="pair">Pair</button>
          <button data-action="info">Device Info</button>
          <button data-action="apps">Apps</button>
          <button data-action="profile-list">Profiles</button>
        </div>

        <h2>Developer Mode</h2>
        <div class="setup-actions">
          <button data-action="devmode-get">Get</button>
          <button data-action="devmode-reveal">Reveal</button>
          <button data-action="devmode-enable">Enable</button>
        </div>

        <h2>Developer Image</h2>
        <div class="setup-actions">
          <button data-action="image-list">List</button>
          <button data-action="image-auto">Auto</button>
        </div>

        <h2>Tunnel</h2>
        <div class="setup-actions">
          <button data-action="tunnel-ls">List</button>
          <button data-action="tunnel-start">Start</button>
          <button data-action="tunnel-refresh">Refresh</button>
          <button data-action="tunnel-stop">Stop</button>
        </div>
      </section>

      <aside class="setup-panel">
        <h2>Command Output</h2>
        <div class="setup-last-command">
          <code id="lastCommandLabel">-</code>
        </div>
        <pre id="setupLog" class="log-box setup-log"></pre>
      </aside>
    </main>

    <script src="/setup.js"></script>
  </body>
</html>
